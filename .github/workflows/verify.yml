# 푸시마다 scripts/verify.sh 를 그대로 돌린다.
#
# CI 전용 명령을 따로 두지 않는 것이 요점이다. 로컬에서 돌리는 것과 CI 가
# 돌리는 것이 갈라지면, 통과했다는 말의 의미도 둘로 갈라진다.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 3.9 만 깨지는지, 전 버전이 깨지는지 한 번에 본다
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 테스트 러너만 깐다. requests·yaml·numpy 를 일부러 넣지 않는 것이
      # 이 잡의 핵심 — 런타임 코어가 그것들 없이 도는지 확인하는 자리다.
      - name: Install test runner only
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Verify
        run: ./scripts/verify.sh
